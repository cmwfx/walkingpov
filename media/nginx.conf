server {
    listen 80;
    listen [::]:80;
    server_name media.candidfan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.candidfan.com;

    ssl_certificate /etc/letsencrypt/live/media.candidfan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.candidfan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~* ^/thumb/(.+\.(?:avif|bmp|gif|ico|jfif|jpe?g|png|tiff?|webp))$ {
        alias /srv/candidfan/thumbnails/$1;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /download/ {
        proxy_pass http://127.0.0.1:3100/verify/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    location /upload-thumbnail/ {
        proxy_pass http://127.0.0.1:3100/upload-thumbnail/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 12m;
        proxy_request_buffering off;
    }

    location ^~ /__candidfan_media/ {
        internal;
        alias /srv/candidfan/media/;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, no-store" always;
    }

    location / { return 404; }
}
