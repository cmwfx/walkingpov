# CandidFan storage VPS: public previews/thumbnails and expiring full MP4 links.
# Deploy with MEDIA_SIGNING_SECRET substituted in secure_link_md5.
server {
    listen 80;
    listen [::]:80;
    server_name media.candidfan.com;

    autoindex off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location /media/previews/ {
        alias /srv/candidfan-media/published/previews/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "https://candidfan.com" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        try_files $uri =404;
    }

    location /media/thumbnails/ {
        alias /srv/candidfan-media/published/thumbnails/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "https://candidfan.com" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        try_files $uri =404;
    }

    location /media/full/ {
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri MEDIA_SIGNING_SECRET";
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }
        alias /srv/candidfan-media/published/full/;
        add_header Cache-Control "private, no-store" always;
        add_header Accept-Ranges bytes always;
        add_header Access-Control-Allow-Origin "https://candidfan.com" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        try_files $uri =404;
    }

    location / { return 404; }
}
