<!doctype html>
<html lang="en">
  <body style="margin:0;background:#0b1224;color:#e5e7eb;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0b1224;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#141d33;border:1px solid #2b3852;border-radius:16px;">
            <tr>
              <td style="padding:28px 32px 12px;">
                <div style="font-size:22px;line-height:28px;font-weight:700;color:#d58cff;">CandidFan</div>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 32px;">
                <h1 style="margin:0;color:#f8fafc;font-size:24px;line-height:32px;font-weight:700;">Confirm your email</h1>
                <p style="margin:16px 0 0;color:#a9b7d0;font-size:16px;line-height:25px;">Enter the verification code below in the CandidFan verification screen to finish creating your account.</p>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
                  <tr>
                    <td align="center" style="padding:20px 12px;background:#0f172a;border:1px solid #6d3fc0;border-radius:12px;">
                      <div style="font-family:'Courier New',Courier,monospace;font-size:32px;line-height:40px;font-weight:700;letter-spacing:8px;color:#ffffff;">{{ .Token }}</div>
                    </td>
                  </tr>
                </table>
                <p style="margin:0;color:#a9b7d0;font-size:14px;line-height:22px;">Keep this code private. If you did not start a CandidFan sign-up, no action is needed.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px 24px;border-top:1px solid #253149;">
                <p style="margin:0;color:#71809b;font-size:12px;line-height:19px;">CandidFan · Account verification</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
